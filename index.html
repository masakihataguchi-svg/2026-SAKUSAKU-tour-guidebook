<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北海道旅行 2026</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/64/64572.png">
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <h1><i class="fas fa-snowflake"></i> Hokkaido 2026</h1>
    </header>

    <main id="content-area">

        <div id="home" class="tab-content active">
            <div id="time-keeper" class="time-keeper-box">
                <div class="current-status">
                    <span id="status-label">NEXT SCHEDULE</span>
                    
                    <h2 id="next-event">ロード中...</h2>
                    
                    <p id="next-detail" style="font-size: 1.3em; font-weight:bold; margin-top: 10px; min-height: 1.2em; white-space: pre-wrap; line-height: 1.4;"></p>
                    
                    <div id="web-link-container" style="display:none; margin-top: 20px;">
                        <p id="web-desc" style="font-size:1.1em; font-weight:bold; margin-bottom:8px; opacity:0.9;"></p>
                        <a id="web-link-btn" href="#" target="_blank" class="event-link-btn">
                            <i class="fas fa-external-link-alt"></i> <span id="web-link-text">リンクを開く</span>
                        </a>
                    </div>

                    <div id="image-container" style="display:none; margin-top: 20px;">
                        <p id="image-desc" style="font-size:1.1em; font-weight:bold; margin-bottom:8px; opacity:0.9;"></p>
                        <div id="media-content"></div>
                    </div>

                    <p id="time-remaining" style="margin-top: 20px;">--:--</p>
                </div>
            </div>
            
            <div style="text-align:center; margin-top:50px; color:#aaa;">
                <i class="fas fa-map-marked-alt" style="font-size: 3em; opacity:0.2;"></i>
                <p>Have a nice trip!</p>
            </div>
        </div>
        
        <div id="schedule" class="tab-content">
            <h2><i class="fas fa-list-ul"></i> 全日程リスト</h2>
            <div class="timeline">
                </div>
        </div>

        <div id="spots" class="tab-content">
            <h2><i class="fas fa-search"></i> スポット検索</h2>
            <input type="text" id="searchBox" placeholder="場所名で検索..." onkeyup="filterSpots()">
            <ul id="spotList">
                 <li class="spot-item">
                    <strong>ジンギスカンだるま</strong>
                    <p>混雑必至。防寒対策して並ぶ。</p>
                    <a href="https://www.google.com/maps/search/?api=1&query=ジンギスカンだるま" target="_blank" class="map-btn">Map</a>
                </li>
                 <li class="spot-item">
                    <strong>小樽運河</strong>
                    <p>夜景が綺麗。クルーズもおすすめ。</p>
                    <a href="https://www.google.com/maps/search/?api=1&query=小樽運河" target="_blank" class="map-btn">Map</a>
                </li>
            </ul>
        </div>

        <div id="memo" class="tab-content">
            <div class="photo-upload-section">
                <h3><i class="fas fa-camera"></i> 思い出アルバム</h3>
                <p>旅の写真はここにアップロード！</p>
                <a href="#" target="_blank" class="upload-btn">Googleフォトを開く</a>
            </div>
            <hr>
            <h2>持ち物チェック</h2>
            <ul class="checklist">
                <li><input type="checkbox"> 航空券 (eチケット)</li>
                <li><input type="checkbox"> モバイルバッテリー</li>
                <li><input type="checkbox"> 充電器・ケーブル</li>
                <li><input type="checkbox"> 常備薬</li>
                <li><input type="checkbox"> 防寒具（手袋・マフラー）</li>
            </ul>
        </div>
    </main>

    <nav class="bottom-nav">
        <button onclick="switchTab('home')" class="nav-btn active">
            <i class="fas fa-home"></i><br>ホーム
        </button>
        <button onclick="switchTab('schedule')" class="nav-btn">
            <i class="fas fa-calendar-alt"></i><br>日程
        </button>
        <button onclick="switchTab('spots')" class="nav-btn">
            <i class="fas fa-map-marker-alt"></i><br>探す
        </button>
        <button onclick="switchTab('memo')" class="nav-btn">
            <i class="fas fa-book"></i><br>メモ
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
