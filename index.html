<div id="time-keeper" class="time-keeper-box">
    <div class="current-status">
        <span id="status-label">NEXT SCHEDULE</span>
        
        <h2 id="next-event">ロード中...</h2>
        
        <p id="next-detail" style="font-size: 0.9em; opacity: 0.9; margin-top: 5px; min-height: 1.2em; white-space: pre-wrap;"></p>
        
        <div id="web-link-container" style="display:none; margin-top: 15px;">
            <p id="web-desc" style="font-size:0.8em; margin-bottom:5px; opacity:0.8;"></p>
            <a id="web-link-btn" href="#" target="_blank" class="event-link-btn">
                <i class="fas fa-external-link-alt"></i> <span id="web-link-text">リンクを開く</span>
            </a>
        </div>

        <div id="image-container" style="display:none; margin-top: 15px;">
            <p id="image-desc" style="font-size:0.8em; margin-bottom:5px; opacity:0.8;"></p>
            <div id="media-content"></div>
        </div>

        <p id="time-remaining" style="margin-top: 15px;">--:--</p>
    </div>
</div>
