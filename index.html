<div id="home" class="tab-content active">
    
    <div id="time-keeper" class="time-keeper-box" style="position: relative;">
        
        <div class="nav-arrow left-arrow" onclick="changeCard(-1)">
            <i class="fas fa-chevron-left"></i>
        </div>

        <div id="swipe-area" class="current-status">
            <span id="status-label">NEXT SCHEDULE</span>
            
            <div class="info-block schedule-block">
                <h2 id="next-event">ロード中...</h2>
                <p id="next-detail" style="white-space: pre-wrap;"></p>
            </div>
            
            <div id="web-link-container" class="info-block web-block" style="display:none;">
                <p id="web-desc" class="block-label"></p>
                <a id="web-link-btn" href="#" target="_blank" class="event-link-btn">
                    <i class="fas fa-external-link-alt"></i> <span id="web-link-text">Webサイトを開く</span>
                </a>
            </div>

            <div id="image-container" class="info-block image-block" style="display:none;">
                <p id="image-desc" class="block-label"></p>
                <div id="media-content"></div>
                <p class="tap-hint"><i class="fas fa-search-plus"></i> タップして拡大</p>
            </div>

            <div class="countdown-area">
                <p id="time-remaining">--:--</p>
            </div>
            
            <p id="card-counter" style="font-size:0.8em; opacity:0.6; margin-top:10px;">-- / --</p>
        </div>

        <div class="nav-arrow right-arrow" onclick="changeCard(1)">
            <i class="fas fa-chevron-right"></i>
        </div>

    </div>
    
    <div style="text-align:center; margin-top:50px; color:#aaa;">
        <i class="fas fa-map-marked-alt" style="font-size: 3em; opacity:0.2;"></i>
        <p>Have a nice trip!</p>
    </div>
</div>
